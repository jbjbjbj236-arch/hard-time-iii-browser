name: Build Hard Time III Browser Edition

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: node --check src/main.js

      - name: Validate site structure
        run: |
          test -s index.html
          test -s style.css
          test -s src/main.js
          grep -q 'src/main.js' index.html
          grep -q 'three@0.166.1' index.html

      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html style.css dist/
          cp -R src dist/
          touch dist/.nojekyll

      - name: Upload playable site artifact
        uses: actions/upload-artifact@v4
        with:
          name: hard-time-iii-browser
          path: dist/
          if-no-files-found: error
          retention-days: 30
